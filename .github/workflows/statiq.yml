name: Statiq

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Two submodules are required: "mahapps" is the API documentation
          # source, "theme" is the Docable theme.
          submodules: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 8.0 builds and runs the generator. The SDK version matters: Statiq
          # restores and compiles the Docable theme project at startup, and that
          # project targets netcoreapp3.1. Under the runner's newest SDK that
          # compilation silently produced nothing - one "warning CS8021: No value
          # for RuntimeMetadataVersion found" - and every Razor page then failed
          # with "The type or namespace name 'Docable' could not be found".
          # global.json pins the SDK to 8.0 so the newest one is not picked.
          #
          # 3.1 is installed for its targeting pack, which building a
          # netcoreapp3.1 project needs. Nothing executes on it.
          dotnet-version: |
            3.1.x
            8.0.x

      - name: Run the Cake script
        uses: cake-build/cake-action@v3
        with:
          cake-version: tool-manifest
          target: CIBuild

      - name: Deploy to GitHub Pages
        if: success() && github.event_name != 'pull_request'
        uses: Cecilapp/GitHub-Pages-deploy@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          email: ${{ secrets.MY_GITHUB_EMAIL }}
          build_dir: ./output
